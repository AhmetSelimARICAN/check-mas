[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkmas"
version = "0.2.0"
description = "Semantic firewall for multi-agent LLM systems. Detect manipulation, fallacies, and adversarial agents in real time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CHECK-MAS Team" },
]
keywords = [
    "multi-agent", "llm", "security", "firewall", "trust",
    "manipulation-detection", "adversarial", "consensus",
    "fact-checking", "semantic-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
langchain = ["langchain-core>=0.2"]
mcp = ["mcp[cli]>=1.0"]
promptguard = [
    "transformers>=4.40",
    "torch>=2.0",
    "accelerate>=0.20",
    "huggingface-hub>=0.20",
    "safetensors",
    "sentencepiece",
]
all = ["openai>=1.0", "langchain-core>=0.2", "mcp[cli]>=1.0", "transformers>=4.30", "torch>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
checkmas-mcp = "checkmas.adapters.mcp_server:main"

[project.urls]
Homepage = "https://github.com/checkmas/checkmas"
Documentation = "https://github.com/checkmas/checkmas#readme"
Repository = "https://github.com/checkmas/checkmas"
Issues = "https://github.com/checkmas/checkmas/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/checkmas"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
